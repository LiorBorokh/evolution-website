<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- DNA double helix icon -->
  <circle cx="8"  cy="4"  r="3" fill="#00ff88"/>
  <circle cx="24" cy="4"  r="3" fill="#444"/>
  <line x1="8" y1="4" x2="24" y2="4" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>

  <circle cx="10" cy="10" r="3" fill="#00ff88"/>
  <circle cx="22" cy="10" r="3" fill="#444"/>
  <line x1="10" y1="10" x2="22" y2="10" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>

  <circle cx="16" cy="16" r="3" fill="#00ff88"/>
  <circle cx="16" cy="16" r="3" fill="#444"/>
  <line x1="8" y1="16" x2="24" y2="16" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>

  <circle cx="10" cy="22" r="3" fill="#00ff88"/>
  <circle cx="22" cy="22" r="3" fill="#444"/>
  <line x1="10" y1="22" x2="22" y2="22" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>

  <circle cx="8"  cy="28" r="3" fill="#00ff88"/>
  <circle cx="24" cy="28" r="3" fill="#444"/>
  <line x1="8" y1="28" x2="24" y2="28" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>

  <!-- Left strand -->
  <path d="M8 4 Q6 10 10 16 Q14 22 8 28" stroke="#00ff88" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- Right strand -->
  <path d="M24 4 Q26 10 22 16 Q18 22 24 28" stroke="#444" stroke-width="2" fill="none" opacity="0.8"/>
</svg>
